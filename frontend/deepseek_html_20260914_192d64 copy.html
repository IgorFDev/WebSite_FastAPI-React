<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Player Carousel</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    background: radial-gradient(circle at 50% 35%, #1c2140 0%, #0a0b14 65%);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    color: #fff;
    overflow: hidden;
    margin-top: 5vh;
  }

  /* ================= КАРУСЕЛЬ ================= */
  .carousel {
    display: flex;
    position: relative;
    width: 100%;
    height: 85vh;
    /* overflow: hidden; */
    /* 👇 вот это и даёт нам cqw-единицы внутри карточек */
    container-type: inline-size;
  }

  /* ================= КАРТОЧКА ================= */
  .card {
    position: absolute;
    top: 0;
    left: 50%;
    aspect-ratio: 3 / 2;
    height: 85%;
    border-radius: 22px;
    overflow: hidden;
    background: #151828;
    box-shadow: 0 25px 60px rgba(0, 0, 0, .6),
                inset 0 0 0 1px rgba(255, 255, 255, .06);
    cursor: pointer;
    user-select: none;
    will-change: transform, left, opacity, filter;
    transition:
      transform   .75s cubic-bezier(.22, .61, .36, 1),
      opacity     .55s ease,
      filter      .75s ease,
      box-shadow  .75s ease;
    backface-visibility: hidden;
    transform: translate3d(0, 0, 0);
  }

  .card img {
    height: 100%;
    object-fit: cover;
    display: block;
    pointer-events: none;
    margin-left: 5%;
  }

  /* затемнение низа + лёгкий градиент поверх фото */
  .card::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(
      to top,
      rgba(8, 10, 20, .96) 0%,
      rgba(8, 10, 20, .70) 25%,
      rgba(8, 10, 20, .15) 50%,
      transparent 70%
    );
    pointer-events: none;
  }

  .card-info {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 20px 18px 22px;
    z-index: 2;
  }

  .card-name {
    font-size: 21px;
    font-weight: 700;
    letter-spacing: .5px;
    margin-bottom: 2px;
  }

  .card-role {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 2.5px;
    color: #7c9cff;
    margin-bottom: 14px;
  }

  .card-stats {
    display: flex;
    gap: 18px;
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: rgba(255, 255, 255, .55);
  }
  .card-stats b {
    display: block;
    font-size: 14px;
    letter-spacing: 0;
    text-transform: none;
    color: #fff;
    margin-bottom: 2px;
  }

  /* ---------- ПОЗИЦИЯ: ЦЕНТР ---------- */
  .card.pos-center {
    transform: translate3d(-50%, 10%, 0);
    filter: brightness(1) saturate(1);
    z-index: 30;
    box-shadow: 0 35px 80px rgba(0, 0, 0, .8),
                inset 0 0 0 1px rgba(255, 255, 255, .12),
                0 0 70px rgba(96, 140, 255, .28);
  }

  /* ---------- ПОЗИЦИЯ: СЛЕВА (видно 20% правой части) ---------- */
  .card.pos-left {
    transform: translate3d(calc(-80% - 50cqw), 0, 0);
    filter: brightness(.42) saturate(.65);
    z-index: 10;
  }

  /* ---------- ПОЗИЦИЯ: СПРАВА (видно 20% левой части) ---------- */
  .card.pos-right {
    transform: translate3d(calc(50cqw - 20%), 0, 0);
    filter: brightness(.42) saturate(.65);
    z-index: 10;
  }

  /* ---------- СКРЫТЫЕ (за кадром) ---------- */
  .card.pos-hidden-left {
    transform: translate3d(calc(-150% - 50cqw), 0, 0);
    opacity: 0;
    filter: brightness(.3);
    z-index: 5;
    pointer-events: none;
  }
  .card.pos-hidden-right {
    transform: translate3d(calc(50cqw + 50%), 0, 0);
    opacity: 0;
    filter: brightness(.3);
    z-index: 5;
    pointer-events: none;
  }

  /* ================= УПРАВЛЕНИЕ ================= */
  .controls {
    display: flex;
    gap: 14px;
    height: 10vh;
  }

  .nav {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, .15);
    background: rgba(255, 255, 255, .05);
    color: #fff;
    font-size: 24px;
    line-height: 1;
    cursor: pointer;
    display: grid;
    place-items: center;
    backdrop-filter: blur(10px);
    transition: background .25s ease, transform .15s ease, border-color .25s ease;
  }
  .nav:hover  { background: rgba(124, 156, 255, .18); border-color: rgba(124, 156, 255, .5); }
  .nav:active { transform: scale(.92); }

  /* адаптив */
  @media (max-width: 760px) {
    .carousel { height: 380px; }
    .card { width: 220px; height: 320px; }
    .card-name { font-size: 17px; }
  }
</style>
</head>
<body>

  <div class="carousel" id="carousel"></div>

  <div class="controls">
    <button class="nav" id="prev">‹</button>
    <button class="nav" id="next">›</button>
  </div>

<script>
(() => {
  /* ---------- ДАННЫЕ ИГРОКОВ ---------- */
  const players = [
    { name: 'NOVA',    role: 'Sniper',     img: 'http://localhost:8000/media/news/ff876199-c0a5-48e2-a478-fbc75398d828-Анастасия.png', kd: '3.42', win: '68%' },
    { name: 'VORTEX',  role: 'Assault',    img: 'http://localhost:8000/media/news/f8199f88-22ec-4f49-ac7c-74811f914c96-Амир.png', kd: '2.87', win: '61%' },
    { name: 'PHANTOM', role: 'Support',    img: 'http://localhost:8000/media/news/ca56f0c2-189d-4c6f-aa48-c89fd1ebd73d-Саня.png', kd: '2.15', win: '72%' },
    { name: 'BLAZE',   role: 'Duelist',    img: 'http://localhost:8000/media/news/f1fb2e72-4f4d-4e22-8528-796b5c1dc999-огузок.jpg', kd: '2.94', win: '59%' },
    { name: 'CYBER',   role: 'Controller', img: 'http://localhost:8000/media/news/2a277178-d29d-4f88-a729-8f99cda025fd-Дима.png', kd: '1.98', win: '74%' },
    { name: 'RAVEN',   role: 'Initiator',  img: 'http://localhost:8000/media/news/ff876199-c0a5-48e2-a478-fbc75398d828-Анастасия.png', kd: '2.53', win: '64%' },
  ];

  const carousel = document.getElementById('carousel');
  const N = players.length;
  let current = 0;
  const cards = [];

  /* ---------- СОЗДАНИЕ КАРТОЧЕК ---------- */
  players.forEach((p, i) => {
    const el = document.createElement('div');
    el.className = 'card';
    el.innerHTML = `
      <img src="${p.img}" alt="${p.name}" draggable="false">
      <div class="card-info">
        <div class="card-name">${p.name}</div>
        <div class="card-role">${p.role}</div>
        <div class="card-stats">
          <div><b>${p.kd}</b>K/D</div>
          <div><b>${p.win}</b>Win rate</div>
        </div>
      </div>
    `;

    // клик по боковой карточке — прокрутка в её сторону
    el.addEventListener('click', () => {
      const off = offsetOf(i);
      if (off === -1) move(-1);
      else if (off === 1) move(1);
    });

    carousel.appendChild(el);
    cards.push(el);
  });

  /* ---------- ВЫЧИСЛЕНИЕ СМЕЩЕНИЯ КАРТОЧКИ ---------- */
  // Возвращает: 0 — центр, 1 — справа, -1 — слева,
  //             2 / -2 / -3 — скрытые позиции за кадром
  function offsetOf(i) {
    let o = (i - current) % N;
    if (o < 0) o += N;          // приводим к диапазону 0..N-1
    if (o >= N / 2) o -= N;     // и к диапазону [-N/2, N/2)
    return o;
  }

  /* ---------- ПРИМЕНЕНИЕ КЛАССОВ ---------- */
  function render() {
    cards.forEach((el, i) => {
      const off = offsetOf(i);
      let cls;

      if (off === 0)        cls = 'pos-center';
      else if (off === 1)   cls = 'pos-right';
      else if (off === -1)  cls = 'pos-left';
      else if (off > 1)     cls = 'pos-hidden-right';
      else                  cls = 'pos-hidden-left';

      el.className = 'card ' + cls;
    });
  }

  /* ---------- ПЕРЕКЛЮЧЕНИЕ ---------- */
  function move(dir) {
    current = (current + dir + N) % N;
    render();
  }

  /* ---------- ОБРАБОТЧИКИ ---------- */
  document.getElementById('prev').addEventListener('click', () => move(-1));
  document.getElementById('next').addEventListener('click', () => move(1));

  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft')  move(-1);
    if (e.key === 'ArrowRight') move(1);
  });

  // свайп
  let startX = null;
  carousel.addEventListener('pointerdown', e => startX = e.clientX);
  carousel.addEventListener('pointerup', e => {
    if (startX === null) return;
    const dx = e.clientX - startX;
    if (Math.abs(dx) > 50) move(dx > 0 ? -1 : 1);
    startX = null;
  });

  /* ---------- СТАРТ ---------- */
  render();
})();
</script>
</body>
</html>
